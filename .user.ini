; Upload limits for the admin panel's media library.
;
; PHP's stock 2 MB rejects an upload in the SAPI before any application code
; runs, so an editor choosing an ordinary phone photo got a failure the site
; could not explain. These raise the ceiling to what includes/security.php
; actually validates against; that file clamps itself to whatever the server
; allows, so the two can never disagree again.
;
; .user.ini is read by PHP-FPM and CGI SAPIs. Under mod_php the equivalent
; php_value lines in .htaccess apply instead. If the host permits neither,
; the application falls back to reporting the real server limit rather than
; pretending to a larger one.
upload_max_filesize = 32M
post_max_size = 40M

; Errors belong in the log, never in the response body.
display_errors = Off
log_errors = On
expose_php = Off
